version: "3.9"
services:
  app:
    build:
      context: .
      args:
        - DEV=true
    ports: # Key must be 'ports' (plural) and aligned with 'build'
      - "8000:8000" # Mapped as a list item, but without leading space error
    volumes: # Key must be aligned with 'build' and 'ports'
      - ./app:/app # The volume path must have a space after the hyphen
    command: >
      sh -c "python manage.py wait_for_db && 
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASS=changeme
    depends_on:
      - db
  
  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changeme
  
volumes:
  dev-db-data: