---
name: Checks

on: [push]

jobs:
  test-lint:
    name: Test and lint
    # Always use ubuntu-latest for stability and automatic updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # You only need to log in if you are pulling private images during the build/test.
      # If your images are public or built locally, you can skip this block.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
          
      # 1. Build the Docker image needed for testing
      # Use the modern 'docker compose' syntax
      - name: Build App Image
        run: docker compose build app
        
      # 2. Run Tests
      # Use the 'run:' key for shell commands
      - name: Test
        run: docker compose run --rm app sh -c "python manage.py test"
        
      # 3. Run Linting
      # Use the 'run:' key for shell commands
      - name: Lint
        run: docker compose run --rm app sh -c "flake8"